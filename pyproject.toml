[tool.uv]
required-version = ">=0.9.17"
exclude-newer = "1 week"

[tool.uv.workspace]
members = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["backend/**/*.py", ".agents/plugins/agent-project-card/skills/agent-project-card/scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["backend/src"]
strict = true

[[tool.mypy.overrides]]
module = ["codex_cli_bin"]
ignore_missing_imports = true
